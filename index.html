          for (let i = 0; i < candleCount; i++) {
            const change = (Math.sin(i * 0.7 + Date.now() * cfg.speed) + Math.cos(i * 0.3)) * cfg.volatility;
            const open = prevClose;
            const close = prevClose - change;
            const high = Math.min(open, close) - Math.abs(change * 0.5);
            const low = Math.max(open, close) + Math.abs(change * 0.5);
            const isBull = close <= open;

            candles.push({ open, close, high, low, isBull, x: i * candleWidth });
            minPrice = Math.min(minPrice, high);
            maxPrice = Math.max(maxPrice, low);
            prevClose = close;
          }

          // 3. Draw Volume Histogram at bottom
          for (let i = 0; i < candleCount; i++) {
            const c = candles[i];
            const vHeight = Math.abs(c.close - c.open) * 1.5 + 4;
            ctx.fillStyle = c.isBull ? '#064e3b' : '#4c0519';
            ctx.fillRect(c.x + 2, plotHeight - vHeight, candleWidth - 4, vHeight);
          }

          // 4. Draw Candlesticks
          for (let i = 0; i < candleCount; i++) {
            const c = candles[i];
            ctx.strokeStyle = c.isBull ? '#10b981' : '#f43f5e';
            ctx.beginPath();
            ctx.moveTo(c.x + candleWidth / 2, c.high);
            ctx.lineTo(c.x + candleWidth / 2, c.low);
            ctx.stroke();

            ctx.fillStyle = c.isBull ? '#10b981' : '#f43f5e';
            ctx.fillRect(c.x + 2, Math.min(c.open, c.close), candleWidth - 4, Math.max(Math.abs(c.close - c.open), 2));
          }

          // 5. Right Y-Axis with live price scale
          ctx.fillStyle = '#09090b';
          ctx.fillRect(plotWidth, 0, rightMargin, height);
          ctx.strokeStyle = '#27272a';
          ctx.beginPath(); ctx.moveTo(plotWidth, 0); ctx.lineTo(plotWidth, height); ctx.stroke();

          ctx.font = '10px monospace';
          ctx.fillStyle = '#71717a';
          for (let y = 20; y < plotHeight; y += 40) {
            const simulatedP = (activeToken.price * (1 + (plotHeight / 2 - y) / plotHeight * 0.08)).toFixed(activeToken.price < 0.01 ? 6 : 2);
            ctx.fillText(`$${simulatedP}`, plotWidth + 6, y + 3);
          }

          // 6. Live guideline pinned to active tick
          ctx.strokeStyle = '#34d399';
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(0, prevClose);
          ctx.lineTo(plotWidth, prevClose);
          ctx.stroke();
          ctx.setLineDash([]);

          // Live tag
          ctx.fillStyle = '#10b981';
          ctx.fillRect(plotWidth + 1, prevClose - 9, rightMargin - 2, 18);
          ctx.fillStyle = '#000000';
          ctx.font = 'bold 9px monospace';
          ctx.fillText(`$${activeToken.price < 0.01 ? activeToken.price.toFixed(6) : activeToken.price.toFixed(2)}`, plotWidth + 4, prevClose + 3);

          animationId = requestAnimationFrame(render);
        };

        render();
        return () => {
          cancelAnimationFrame(animationId);

                      className="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded cursor-pointer"
                    >
                      + Deposit Test Funds
                    </button>
                    <button
                      onClick={() => {
                        if (confirm('Create new key? Ensure previous key is backed up!')) createWallet();
                      }}
                      className="py-2 px-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded cursor-pointer"
                    >
                      New Key
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MARKETPLACE BOOST MODAL */}
          {marketModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 font-mono">
              <div className="bg-zinc-950 border border-zinc-800 rounded-xl p-6 max-w-md w-full">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white">BOOST & VERIFY TOKEN</h3>
                  <button onClick={() => setMarketModalOpen(false)} className="text-zinc-400 hover:text-white cursor-pointer">✕</button>
                </div>
                <div className="space-y-3">
                  <div className="border border-zinc-800 p-3 rounded-lg bg-zinc-900/40 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-white">Alpha Blitz (24h)</div>
                      <div className="text-xs text-zinc-400">5x Trending Boost</div>
                    </div>
                    <button onClick={() => { alert('Boost Activated!'); setMarketModalOpen(false); }} className="bg-emerald-500 text-black font-bold px-3 py-1.5 rounded text-xs hover:bg-emerald-400 cursor-pointer">$69</button>
                  </div>
                  <div className="border border-zinc-800 p-3 rounded-lg bg-zinc-900/40 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-white">Anti-Cabal Pass</div>
                      <div className="text-xs text-zinc-400">Full Cluster Audit Badge</div>
                    </div>
                    <button onClick={() => { alert('Audit Queued!'); setMarketModalOpen(false); }} className="bg-emerald-500 text-black font-bold px-3 py-1.5 rounded text-xs hover:bg-emerald-400 cursor-pointer">$79</button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
