    // PUMP.FUN EMBEDDED WALLET GENERATOR
    function generateBurnerWallet() {
      const array = new Uint8Array(32);
      window.crypto.getRandomValues(array);
      const hex = Array.from(array).map(b => b.toString(16).padStart(2, '0')).join('');
      const address = "0x" + hex.slice(0, 40);
      const privateKey = "0x" + hex;
      return { address, privateKey };
    }

      const [buyAmount, setBuyAmount] = useState('0.1');
      const [marketModalOpen, setMarketModalOpen] = useState(false);
      const [walletModalOpen, setWalletModalOpen] = useState(false);
      const [orderNotification, setOrderNotification] = useState(null);
      const [wallet, setWallet] = useState(null);
      const [balance, setBalance] = useState(1.50);
      const [showPrivateKey, setShowPrivateKey] = useState(false);
      const canvasRef = useRef(null);

      // Load wallet from localStorage
      useEffect(() => {
        const saved = localStorage.getItem('tz_burner_wallet');
        if (saved) {
          try { setWallet(JSON.parse(saved)); } catch(e) {}
        }
      }, []);

      const createWallet = () => {
        const newWallet = generateBurnerWallet();
        setWallet(newWallet);
        localStorage.setItem('tz_burner_wallet', JSON.stringify(newWallet));
        setBalance(2.00);
        setWalletModalOpen(true);
      };

      const handleChainSwitch = (chainKey) => {
        setSelectedChainKey(chainKey);
        setActiveToken(TOKEN_REGISTRY[chainKey][0]);
      };

      // Filter pairs dynamically
      const filteredPairs = useMemo(() => {
        const list = TOKEN_REGISTRY[selectedChainKey] || [];
        if (!searchQuery.trim()) return list;
        return list.filter(item => 
          item.symbol.toLowerCase().includes(searchQuery.toLowerCase()) || 
          item.name.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }, [selectedChainKey, searchQuery]);

      // High-Frequency Canvas Candlestick Loop
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationId;

        const renderChart = () => {
          const width = canvas.width;
          const height = canvas.height;
          ctx.clearRect(0, 0, width, height);

          // Grid
          ctx.strokeStyle = '#18181b';
          ctx.lineWidth = 1;
          for (let x = 0; x < width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke(); }
          for (let y = 0; y < height; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }

          const candleCount = 28;
          const candleWidth = (width - 40) / candleCount;
          let prevClose = height * 0.52;

          for (let i = 0; i < candleCount; i++) {
            const x = i * candleWidth + 10;
            const change = (Math.sin(i * 0.8 + Date.now() * 0.0012) + Math.cos(i * 0.35)) * 11;
            const open = prevClose;
            const close = prevClose - change;
            const high = Math.min(open, close) - 7;
            const low = Math.max(open, close) + 7;
            const isBull = close <= open;

            ctx.strokeStyle = isBull ? '#10b981' : '#f43f5e';
            ctx.beginPath();
            ctx.moveTo(x + candleWidth / 2, high);
            ctx.lineTo(x + candleWidth / 2, low);
            ctx.stroke();

            ctx.fillStyle = isBull ? '#10b981' : '#f43f5e';
            ctx.fillRect(x + 2, Math.min(open, close), candleWidth - 4, Math.max(Math.abs(close - open), 2));
            prevClose = close;
          }

          ctx.strokeStyle = '#34d399';
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(0, prevClose);
          ctx.lineTo(width, prevClose);
          ctx.stroke();
          ctx.setLineDash([]);

          animationId = requestAnimationFrame(renderChart);
        };

        renderChart();
        return () => cancelAnimationFrame(animationId);
      }, [activeToken]);

      const triggerOrder = (type) => {
        if (!wallet) {
          createWallet();
          return;
        }
        const cost = parseFloat(buyAmount) || 0.1;
        if (type === 'BUY') {
          if (balance < cost) {
            alert('Insufficient balance in your embedded burner wallet!');
            return;
          }
          setBalance(prev => Math.max(0, prev - cost));
          setOrderNotification(`FILLED: BUY ${buyAmount} ${activeToken.symbol} on ${activeChain.name}`);
        } else {
          setBalance(prev => prev + 0.35);
          setOrderNotification(`PANIC DUMP 100% EXECUTED for ${activeToken.symbol}`);
        }
        setTimeout(() => setOrderNotification(null), 2500);
      };

      return (
        <div className="flex h-screen w-screen flex-col bg-zinc-950 font-sans">
          
          {/* HEADER BAR */}
          <header className="flex h-12 w-full items-center justify-between border-b border-zinc-800 bg-zinc-950 px-4">
            <div className="flex items-center gap-3">
              <span className="flex h-6 w-6 items-center justify-center rounded bg-emerald-500 font-mono text-xs font-black text-black">0</span>
              <span className="font-mono text-sm font-black tracking-wider text-white">TERMINAL<span className="text-emerald-400">ZERO</span></span>
              
              <div className="flex items-center gap-1 bg-zinc-900 p-0.5 rounded border border-zinc-800 ml-3">
                {Object.entries(CHAINS).map(([key, chain]) => (
                  <button
                    key={key}
                    onClick={() => handleChainSwitch(key)}
                    className={`px-2.5 py-1 text-xs font-mono rounded transition ${selectedChainKey === key ? 'bg-zinc-800 text-white font-bold border border-zinc-700' : 'text-zinc-400 hover:text-white'}`}
                  >
                    {chain.name}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-3 font-mono text-xs">
              <span className="text-emerald-400">● {activeChain.mevEngine}</span>

              {/* EMBEDDED WALLET BUTTON */}
              {wallet ? (
                <button
                  onClick={() => setWalletModalOpen(true)}
                  className="flex items-center gap-2 bg-zinc-900 border border-emerald-500/50 hover:border-emerald-400 px-3 py-1 rounded text-white font-mono"
                >
                  <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="font-bold text-emerald-400">{balance.toFixed(2)} {activeChain.symbol}</span>
                  <span className="text-zinc-500 text-[10px]">({wallet.address.slice(0, 4)}...{wallet.address.slice(-4)})</span>
                </button>
              ) : (
                <button
                  onClick={createWallet}
                  className="bg-emerald-500 hover:bg-emerald-400 text-black px-3 py-1 rounded font-bold transition flex items-center gap-1"
                >
                  ⚡ CREATE WALLET
                </button>
              )}

              <button
                onClick={() => setMarketModalOpen(true)}
                className="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-1 rounded font-bold border border-zinc-700"
              >
                BOOST
              </button>
            </div>
          </header>

          {/* MAIN TERMINAL BODY */}
          <div className="flex flex-1 overflow-hidden relative">
            {orderNotification && (
              <div className="absolute top-4 right-8 z-50 bg-emerald-950 border border-emerald-500 text-emerald-300 px-4 py-2 rounded font-mono text-xs shadow-xl animate-bounce">
                {orderNotification}
              </div>
            )}

            {/* PAIRS DRAWER (LEFT COLUMN) */}
            <div className="w-80 border-r border-zinc-800 bg-zinc-950/70 flex flex-col font-mono text-xs">
              <div className="p-3 border-b border-zinc-800">
                <div className="flex justify-between items-center mb-2">
                  <span className="font-bold text-amber-400 flex items-center gap-1">
                    ⚡ {activeChain.name.toUpperCase()} RADAR
                  </span>
                  <span className="text-[10px] bg-zinc-900 border border-zinc-800 px-1.5 py-0.5 rounded text-zinc-400">
                    {filteredPairs.length} pairs
                  </span>
                </div>
                <input
                  type="text"
                  placeholder="Filter ticker / name..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-zinc-900 border border-zinc-800 rounded px-2.5 py-1.5 text-white outline-none focus:border-emerald-500 placeholder:text-zinc-600 text-xs"
                />
              </div>

              <div className="flex-1 overflow-y-auto divide-y divide-zinc-900/60">
                {filteredPairs.map((item, idx) => (
                  <div
                    key={item.symbol}
                    onClick={() => setActiveToken(item)}
                    className={`p-2.5 cursor-pointer flex justify-between items-center transition ${activeToken.symbol === item.symbol ? 'bg-zinc-800/80 border-l-2 border-emerald-400' : 'hover:bg-zinc-900/50'}`}
                  >
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] text-zinc-600 w-4 font-bold">{idx + 1}</span>
                      <div>
                        <div className="font-bold text-white flex items-center gap-1.5">
                          {item.symbol}
                          <span className="text-[9px] text-zinc-400 font-normal">{item.pair}</span>
                        </div>
                        <div className="text-[10px] text-zinc-500">{item.name}</div>
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="text-white font-bold">${item.price < 0.001 ? item.price.toFixed(7) : item.price.toFixed(item.price < 1 ? 4 : 2)}</div>
                      <div className={`text-[10px] font-bold ${item.change24h >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {item.change24h >= 0 ? '+' : ''}{item.change24h}%
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* CHART DISPLAY (CENTER COLUMN) */}
            <div className="flex flex-1 flex-col border-r border-zinc-800">
              <div className="flex h-14 items-center justify-between border-b border-zinc-800 bg-zinc-900/30 px-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-base font-black text-white">{activeToken.pair}</span>
                    <span className="text-xs text-zinc-400 font-mono">{activeToken.name}</span>
                    <span className={`text-[10px] px-1.5 py-0.5 rounded border font-mono ${activeChain.badge}`}>
                      {activeChain.name}
                    </span>
                  </div>
                  <div className="flex items-center gap-3 font-mono text-xs">
                    <span className="text-lg font-bold text-emerald-400">
                      ${activeToken.price < 0.001 ? activeToken.price.toFixed(7) : activeToken.price.toFixed(activeToken.price < 1 ? 4 : 2)}
                    </span>
                    <span className={`font-bold ${activeToken.change24h >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {activeToken.change24h >= 0 ? '+' : ''}{activeToken.change24h}%
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-4 font-mono text-xs">
                  <div className="text-right">
                    <div className="text-[10px] text-zinc-400">24H VOLUME</div>
                    <div className="font-bold text-zinc-200">${activeToken.vol24h}M</div>
                  </div>
                  <div className="rounded border border-zinc-800 bg-zinc-950 px-3 py-1.5 text-center">
                    <div className="text-[10px] text-zinc-400">CONNECTED SUPPLY (CSR)</div>
                    <div className={`font-black ${activeToken.csr > 20 ? 'text-rose-400' : 'text-emerald-400'}`}>
                      {activeToken.csr}% {activeToken.csr > 20 ? 'CABAL RISK' : 'CLEAN'}
                    </div>
                  </div>
                </div>
              </div>

              <div className="flex-1 bg-zinc-950 p-2 flex flex-col justify-between">
                <div className="flex items-center justify-between border-b border-zinc-900 pb-2 px-2 font-mono text-xs text-zinc-400">
                  <div className="flex gap-2">
                    <span className="text-emerald-400 font-bold">1s</span>
                    <span className="hover:text-white cursor-pointer">1m</span>
                    <span className="hover:text-white cursor-pointer">5m</span>
                    <span className="hover:text-white cursor-pointer">1h</span>
                  </div>
                  <div className="flex items-center gap-2 text-[10px] text-emerald-400">
                    <span className="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse" />
                    LIVE SUB-SECOND INGEST
                  </div>
                </div>

                <div className="relative flex-1 w-full my-2">
                  <canvas ref={canvasRef} width={800} height={400} className="w-full h-full block" />
                </div>
              </div>
            </div>

            {/* 1-CLICK SNIPER DOCK (RIGHT COLUMN) */}
            <div className="w-72 p-4 font-mono text-xs flex flex-col justify-between">
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <span className="font-bold text-zinc-300">1-CLICK EXECUTION</span>
                  <span className="text-[10px] text-emerald-400">MEV SHIELD ON</span>
                </div>

                <div>
                  <label className="text-[10px] text-zinc-400">AMOUNT ({activeChain.symbol})</label>
                  <input
                    type="text"
                    value={buyAmount}
                    onChange={(e) => setBuyAmount(e.target.value)}
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-white font-bold outline-none focus:border-emerald-500"
                  />
                </div>

                <div className="grid grid-cols-3 gap-1">
                  {['0.05', '0.1', '0.5'].map(val => (
                    <button key={val} onClick={() => setBuyAmount(val)} className="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 py-1 rounded text-zinc-300">
                      {val} {activeChain.symbol}
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => triggerOrder('BUY')}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-lg transition"
                >
                  BUY {activeToken.symbol}
                </button>

                <button
                  onClick={() => triggerOrder('SELL')}
                  className="w-full py-2 bg-rose-950 border border-rose-800 text-rose-300 font-bold rounded-lg hover:bg-rose-900 transition"
                >
                  PANIC SELL 100%
                </button>
              </div>

              {wallet && (
                <div className="border border-zinc-800 rounded p-2.5 bg-zinc-900/40 text-[11px] text-zinc-400">
                  <div className="flex justify-between">
                    <span>Active Burner:</span>
                    <span className="text-emerald-400 font-bold">{balance.toFixed(2)} {activeChain.symbol}</span>
                  </div>
                  <div className="truncate text-zinc-500 mt-1">{wallet.address}</div>
                </div>
              )}
            </div>

          </div>

          {/* WALLET DETAILS MODAL */}
          {walletModalOpen && wallet && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 font-mono">
              <div className="bg-zinc-950 border border-zinc-800 rounded-xl p-6 max-w-md w-full shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <div className="flex items-center gap-2">
                    <span className="h-3 w-3 rounded-full bg-emerald-400"></span>
                    <h3 className="font-bold text-white text-sm">YOUR EMBEDDED WALLET</h3>
                  </div>
                  <button onClick={() => setWalletModalOpen(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="bg-zinc-900/80 p-3 rounded-lg border border-zinc-800">
                    <div className="text-[10px] text-zinc-400 mb-1">DEPOSIT ADDRESS ({activeChain.name})</div>
                    <div className="text-emerald-300 break-all select-all font-mono font-bold bg-zinc-950 p-2 rounded border border-zinc-800">
                      {wallet.address}
                    </div>
                    <button
                      onClick={() => { navigator.clipboard.writeText(wallet.address); alert('Address Copied!'); }}
                      className="mt-2 w-full py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded text-center font-bold"
                    >
                      📋 Copy Address
                    </button>
                  </div>

                  <div className="bg-zinc-900/80 p-3 rounded-lg border border-zinc-800">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-[10px] text-zinc-400">PRIVATE KEY (EXPORT ANYTIME)</span>
                      <button
                        onClick={() => setShowPrivateKey(!showPrivateKey)}
                        className="text-[10px] text-emerald-400 hover:underline"
                      >
                        {showPrivateKey ? 'Hide' : 'Reveal'}
                      </button>
                    </div>
                    <div className="text-rose-400 break-all select-all font-mono bg-zinc-950 p-2 rounded border border-zinc-800">
                      {showPrivateKey ? wallet.privateKey : '••••••••••••••••••••••••••••••••••••••••••••••••'}
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={() => { setBalance(b => b + 1.0); alert('1.0 Test Deposit Added!'); }}
                      className="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded"
                    >
                      + Deposit Test Funds
                    </button>
                    <button
                      onClick={() => {
                        if (confirm('Create new key? Ensure previous key is backed up!')) createWallet();
                      }}
                      className="py-2 px-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded"
                    >
                      New Key
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MARKETPLACE PROMOTION MODAL */}
          {marketModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 font-mono">
              <div className="bg-zinc-950 border border-zinc-800 rounded-xl p-6 max-w-md w-full">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white">BOOST & VERIFY TOKEN</h3>
                  <button onClick={() => setMarketModalOpen(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>
                <div className="space-y-3">
                  <div className="border border-zinc-800 p-3 rounded-lg bg-zinc-900/40 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-white">Alpha Blitz (24h)</div>
                      <div className="text-xs text-zinc-400">5x Trending Boost</div>
                    </div>
                    <button onClick={() => { alert('Boost Activated!'); setMarketModalOpen(false); }} className="bg-emerald-500 text-black font-bold px-3 py-1.5 rounded text-xs hover:bg-emerald-400">$69</button>
                  </div>
                  <div className="border border-zinc-800 p-3 rounded-lg bg-zinc-900/40 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-white">Anti-Cabal Pass</div>
                      <div className="text-xs text-zinc-400">Full Cluster Audit Badge</div>
                    </div>
                    <button onClick={() => { alert('Audit Queued!'); setMarketModalOpen(false); }} className="bg-emerald-500 text-black font-bold px-3 py-1.5 rounded text-xs hover:bg-emerald-400">$79</button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
