                      <span className="text-zinc-700">•</span>
                      <a href={activeToken.socials?.website} target="_blank" rel="noreferrer" className="text-zinc-400 hover:text-emerald-400 flex items-center gap-1 hover:underline">
                        🌐 Website
                      </a>
                    </div>
                  </div>
                </div>

                {/* HISTORICAL MARKET SNAPSHOT */}
                <div className="flex items-center gap-5 font-mono text-xs">
                  <div className="text-right">
                    <div className="text-[10px] text-zinc-500">ALL-TIME HIGH (ATH)</div>
                    <div className="font-bold text-emerald-400">${activeToken.ath} <span className="text-[10px] text-zinc-400">({activeToken.athDrawdown})</span></div>
                  </div>

                  <div className="text-right">
                    <div className="text-[10px] text-zinc-500">CREATED / AGE</div>
                    <div className="font-bold text-zinc-200">{activeToken.age}</div>
                  </div>

                  <div className="rounded border border-zinc-800 bg-zinc-950 px-3 py-1.5 text-center">
                    <div className="text-[10px] text-zinc-500">CONNECTED SUPPLY (CSR)</div>
                    <div className={`font-black ${activeToken.csr > 20 ? 'text-rose-400' : 'text-emerald-400'}`}>
                      {activeToken.csr}% {activeToken.csr > 20 ? 'CABAL RISK' : 'CLEAN'}
                    </div>
                  </div>
                </div>
              </div>

              {/* LIVE CHART */}
              <div className="flex-1 bg-zinc-950 p-2 flex flex-col justify-between">
                <div className="flex items-center justify-between border-b border-zinc-900 pb-2 px-2 font-mono text-xs text-zinc-400">
                  <div className="flex gap-2">
                    <span className="text-emerald-400 font-bold">1s</span>
                    <span className="hover:text-white cursor-pointer">1m</span>
                    <span className="hover:text-white cursor-pointer">5m</span>
                    <span className="hover:text-white cursor-pointer">1h</span>
                  </div>
                  <div className="flex items-center gap-2 text-[10px] text-emerald-400">
                    <span className="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse" />
                    LIVE SUB-SECOND INGEST
                  </div>
                </div>

                <div className="relative flex-1 w-full my-2">
                  <canvas ref={canvasRef} width={800} height={400} className="w-full h-full block" />
                </div>
              </div>
            </div>

            {/* 1-CLICK SNIPER DOCK (RIGHT COLUMN) */}
            <div className="w-72 p-4 font-mono text-xs flex flex-col justify-between">
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <span className="font-bold text-zinc-300">1-CLICK EXECUTION</span>
                  <span className="text-[10px] text-emerald-400">MEV SHIELD ON</span>
                </div>

                <div>
                  <label className="text-[10px] text-zinc-400">AMOUNT ({activeChain.symbol})</label>
                  <input
                    type="text"
                    value={buyAmount}
                    onChange={(e) => setBuyAmount(e.target.value)}
                    className="w-full mt-1 bg-zinc-900 border border-zinc-800 rounded px-3 py-2 text-white font-bold outline-none focus:border-emerald-500"
                  />
                </div>

                <div className="grid grid-cols-3 gap-1">
                  {['0.05', '0.1', '0.5'].map(val => (
                    <button key={val} onClick={() => setBuyAmount(val)} className="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 py-1 rounded text-zinc-300">
                      {val} {activeChain.symbol}
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => triggerOrder('BUY')}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-lg transition cursor-pointer"
                >
                  BUY {activeToken.symbol}
                </button>

                <button
                  onClick={() => triggerOrder('SELL')}
                  className="w-full py-2 bg-rose-950 border border-rose-800 text-rose-300 font-bold rounded-lg hover:bg-rose-900 transition cursor-pointer"
                >
                  PANIC SELL 100%
                </button>
              </div>

              {wallet && (
                <div className="border border-zinc-800 rounded p-2.5 bg-zinc-900/40 text-[11px] text-zinc-400">
                  <div className="flex justify-between">
                    <span>Active Burner:</span>
                    <span className="text-emerald-400 font-bold">{balance.toFixed(2)} {activeChain.symbol}</span>
                  </div>
                  <div className="truncate text-zinc-500 mt-1">{wallet.address}</div>
                </div>
              )}
            </div>

          </div>

          {/* COMPREHENSIVE TOKEN DOSSIER MODAL */}
          {dossierModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 font-mono">
              <div className="bg-zinc-950 border border-zinc-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative border border-emerald-500/30">
                
                <div className="p-6 border-b border-zinc-800 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/40 flex items-center justify-center text-xl font-black text-emerald-400">
                      {activeToken.symbol.slice(0, 2)}
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h2 className="text-xl font-black text-white">{activeToken.name}</h2>
                        <span className="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded font-bold">
                          {activeToken.symbol}
                        </span>
                      </div>
                      <div className="text-xs text-zinc-400 mt-0.5">{activeToken.pair} • Minted via {activeToken.platform}</div>
                    </div>
                  </div>
                  <button 
                    onClick={() => setDossierModalOpen(false)} 
                    className="bg-zinc-900 hover:bg-zinc-800 text-white p-2 rounded-lg cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 space-y-6 text-xs">
                  <div>
                    <h3 className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2">OFFICIAL COMMUNITY & SOCIAL LINKS</h3>
                    <div className="grid grid-cols-4 gap-2">
                      <a href={activeToken.socials?.twitter} target="_blank" rel="noreferrer" className="flex items-center justify-center py-2 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-zinc-600 text-white font-bold transition">
                        𝕏 Twitter
                      </a>
                      <a href={activeToken.socials?.telegram} target="_blank" rel="noreferrer" className="flex items-center justify-center py-2 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-sky-500 text-sky-400 font-bold transition">
                        ✈ Telegram
                      </a>
                      <a href={activeToken.socials?.website} target="_blank" rel="noreferrer" className="flex items-center justify-center py-2 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-emerald-500 text-emerald-400 font-bold transition">
                        🌐 Website
                      </a>
                      <a href={activeToken.socials?.docs} target="_blank" rel="noreferrer" className="flex items-center justify-center py-2 bg-zinc-900 border border-zinc-800 rounded-lg hover:border-indigo-500 text-indigo-400 font-bold transition">
                        📄 Whitepaper
                      </a>
                    </div>
                  </div>

                  <div>
                    <h3 className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2">HISTORICAL EXTREMES & GENESIS</h3>
                    <div className="grid grid-cols-3 gap-3">
                      <div className="bg-zinc-900/60 border border-zinc-800 p-3 rounded-xl">
                        <div className="text-[10px] text-zinc-400">ALL-TIME HIGH (ATH)</div>
                        <div className="text-base font-black text-emerald-400 mt-0.5">${activeToken.ath}</div>
                        <div className="text-[10px] text-zinc-500">{activeToken.athDate} ({activeToken.athDrawdown})</div>
                      </div>
                      <div className="bg-zinc-900/60 border border-zinc-800 p-3 rounded-xl">
                        <div className="text-[10px] text-zinc-400">ALL-TIME LOW (ATL)</div>
                        <div className="text-base font-black text-indigo-400 mt-0.5">${activeToken.atl}</div>
                        <div className="text-[10px] text-zinc-500">{activeToken.atlDate} ({activeToken.atlGain})</div>
                      </div>
                      <div className="bg-zinc-900/60 border border-zinc-800 p-3 rounded-xl">
                        <div className="text-[10px] text-zinc-400">CREATED / AGE</div>
                        <div className="text-base font-black text-zinc-200 mt-0.5">{activeToken.age}</div>
                        <div className="text-[10px] text-zinc-500">{activeToken.createdDate}</div>
                      </div>
                    </div>
                  </div>

                  <div>
                    <h3 className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">PROJECT BACKGROUND & NARRATIVE</h3>
                    <div className="bg-zinc-900/40 border border-zinc-800/80 p-3.5 rounded-xl leading-relaxed text-zinc-300">
                      {activeToken.about}
                    </div>
                  </div>

                  <div className="bg-zinc-900/80 border border-zinc-800 p-3 rounded-xl flex justify-between items-center">
                    <div>
                      <div className="text-[10px] text-zinc-400">CONTRACT ADDRESS</div>
                      <div className="text-emerald-400 font-mono text-[11px] break-all select-all">{activeToken.contract}</div>
                    </div>
                    <button 
                      onClick={() => { navigator.clipboard.writeText(activeToken.contract); alert('Contract address copied!'); }}
                      className="ml-3 bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded font-bold text-white shrink-0 cursor-pointer"
                    >
                      📋 Copy
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* WALLET DETAILS MODAL */}
          {walletModalOpen && wallet && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 font-mono">
              <div className="bg-zinc-950 border border-zinc-800 rounded-xl p-6 max-w-md w-full shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <div className="flex items-center gap-2">
                    <span className="h-3 w-3 rounded-full bg-emerald-400"></span>
                    <h3 className="font-bold text-white text-sm">YOUR EMBEDDED WALLET</h3>
                  </div>
                  <button onClick={() => setWalletModalOpen(false)} className="text-zinc-400 hover:text-white cursor-pointer">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="bg-zinc-900/80 p-3 rounded-lg border border-zinc-800">
                    <div className="text-[10px] text-zinc-400 mb-1">DEPOSIT ADDRESS ({activeChain.name})</div>
                    <div className="text-emerald-300 break-all select-all font-mono font-bold bg-zinc-950 p-2 rounded border border-zinc-800">
                      {wallet.address}
                    </div>
                    <button
                      onClick={() => { navigator.clipboard.writeText(wallet.address); alert('Address Copied!'); }}
                      className="mt-2 w-full py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded text-center font-bold cursor-pointer"
                    >
                      📋 Copy Address
                    </button>
                  </div>

                  <div className="bg-zinc-900/80 p-3 rounded-lg border border-zinc-800">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-[10px] text-zinc-400">PRIVATE KEY (EXPORT ANYTIME)</span>
                      <button
                        onClick={() => setShowPrivateKey(!showPrivateKey)}
                        className="text-[10px] text-emerald-400 hover:underline cursor-pointer"
                      >
                        {showPrivateKey ? 'Hide' : 'Reveal'}
                      </button>
                    </div>
                    <div className="text-rose-400 break-all select-all font-mono bg-zinc-950 p-2 rounded border border-zinc-800">
                      {showPrivateKey ? wallet.privateKey : '••••••••••••••••••••••••••••••••••••••••••••••••'}
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={() => { setBalance(b => b + 1.0); alert('1.0 Test Deposit Added!'); }}
                      className="flex-1 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded cursor-pointer"
                    >
                      + Deposit Test Funds
                    </button>
                    <button
                      onClick={() => {
                        if (confirm('Create new key? Ensure previous key is backed up!')) createWallet();
                      }}
                      className="py-2 px-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded cursor-pointer"
                    >
                      New Key
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MARKETPLACE PROMOTION MODAL */}
          {marketModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 font-mono">
              <div className="bg-zinc-950 border border-zinc-800 rounded-xl p-6 max-w-md w-full">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white">BOOST & VERIFY TOKEN</h3>
                  <button onClick={() => setMarketModalOpen(false)} className="text-zinc-400 hover:text-white cursor-pointer">✕</button>
                </div>
                <div className="space-y-3">
                  <div className="border border-zinc-800 p-3 rounded-lg bg-zinc-900/40 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-white">Alpha Blitz (24h)</div>
                      <div className="text-xs text-zinc-400">5x Trending Boost</div>
                    </div>
                    <button onClick={() => { alert('Boost Activated!'); setMarketModalOpen(false); }} className="bg-emerald-500 text-black font-bold px-3 py-1.5 rounded text-xs hover:bg-emerald-400 cursor-pointer">$69</button>
                  </div>
                  <div className="border border-zinc-800 p-3 rounded-lg bg-zinc-900/40 flex justify-between items-center">
                    <div>
                      <div className="font-bold text-white">Anti-Cabal Pass</div>
                      <div className="text-xs text-zinc-400">Full Cluster Audit Badge</div>
                    </div>
                    <button onClick={() => { alert('Audit Queued!'); setMarketModalOpen(false); }} className="bg-emerald-500 text-black font-bold px-3 py-1.5 rounded text-xs hover:bg-emerald-400 cursor-pointer">$79</button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
